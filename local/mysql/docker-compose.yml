services:
  mysql:
    image: mysql:8
    container_name: capstone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: capstone
      MYSQL_USER: capstone
      MYSQL_PASSWORD: capstone
      MYSQL_DATABASE: capstone
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
